[build]
  command = "npm run build"
  publish = "dist"

[functions]
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "24"

[[redirects]]
  from = "/api/tech-news"
  to = "/.netlify/functions/tech-news"
  status = 200
  force = true

[[redirects]]
  from = "/api/qudrat-pro"
  to = "/.netlify/functions/qudrat-pro"
  status = 200
  force = true

[[redirects]]
  from = "/api/qudrat-source"
  to = "/.netlify/functions/qudrat-source"
  status = 200
  force = true

[[redirects]]
  from = "/api/drive-video"
  to = "/.netlify/functions/drive-video"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
