name: Build and checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test tests/accounts.test.mjs tests/news.test.mjs tests/loop.test.mjs
      - run: npm run build
      - run: npm run build:local
